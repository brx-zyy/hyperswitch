name: DNS rebinding regression proof

on:
  push:
    branches:
      - security-test/dns-rebinding-proof
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-dns-rebinding:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config libcap2-bin

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      # Cargo must fetch Git dependencies using the runner's normal resolver first.
      - name: Compile the targeted regression test
        run: cargo test -p external_services --features v1 --test dns_rebinding --no-run

      - name: Confirm compiled test binary exists
        run: find target -type f -executable -name 'dns_rebinding-*' -print

      - name: Grant the test binary permission to bind local DNS port
        run: |
          TEST_BIN="$(find target -type f -executable -name 'dns_rebinding-*' | head -n 1)"
          test -n "$TEST_BIN"
          echo "TEST_BIN=$TEST_BIN" >> "$GITHUB_ENV"
          sudo setcap cap_net_bind_service=+ep "$TEST_BIN"

      - name: Run isolated DNS rebinding regression test and restore resolver
        shell: bash
        run: |
          set -euo pipefail
          sudo cp -L /etc/resolv.conf /tmp/resolv.conf.before-test
          restore_resolver() {
            sudo cp /tmp/resolv.conf.before-test /etc/resolv.conf || true
          }
          trap restore_resolver EXIT
          sudo sh -c 'printf "nameserver 127.0.0.1\noptions timeout:1 attempts:1 ndots:1\n" > /etc/resolv.conf'
          cat /etc/resolv.conf
          "$TEST_BIN" --nocapture
