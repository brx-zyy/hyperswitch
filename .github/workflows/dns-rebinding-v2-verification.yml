name: DNS rebinding verification - v2
on:
  push:
    branches:
      - security-test/dns-rebinding-proof
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dns-rebinding-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libssl-dev pkg-config libcap2-bin
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Compile DNS rebinding test with v2
        run: cargo test -p external_services --features 'v2 euclid/v2' --test dns_rebinding --no-run
      - name: Run DNS rebinding test with v2
        shell: bash
        run: |
          set -euo pipefail
          TEST_BIN="$(find target -type f -executable -name 'dns_rebinding-*' | head -n 1)"
          test -n "$TEST_BIN"
          sudo setcap cap_net_bind_service=+ep "$TEST_BIN"
          sudo cp -L /etc/resolv.conf /tmp/resolv.conf.before-test
          restore_resolver() { sudo cp /tmp/resolv.conf.before-test /etc/resolv.conf || true; }
          trap restore_resolver EXIT
          sudo sh -c 'printf "nameserver 127.0.0.1\noptions timeout:1 attempts:1 ndots:1\n" > /etc/resolv.conf'
          "$TEST_BIN" --nocapture
